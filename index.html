<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kong">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Kong">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Kong Classic 2.0: programma di 48 settimane con carichi dai massimali, recuperi e timer.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Kong Classic 2.0 · App di allenamento</title>
<style>:root{--bg:#f6f6f4;--card:#fff;--tp:#16181c;--ts:#5d636b;--bs:#e7e7e3;--bd:#d4d4cf;--bst:#16181c;--acc:#2f7d4f;--pri:#16181c;--prit:#fff;--danger:#c62828;--info:#e8f0fb;--infob:#9bb7e0;--warn:#fff4e0;--warnb:#e0b46a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1012;--card:#18191c;--tp:#eceef0;--ts:#a0a6ad;--bs:#2a2c30;--bd:#3a3d42;--bst:#eceef0;--acc:#4cc27a;--pri:#eceef0;--prit:#111;--danger:#ff6b6b;--info:#16233a;--infob:#35507a;--warn:#33270f;--warnb:#7a5a20}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tp);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.page{max-width:1040px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:24px;line-height:1.2;margin:8px 0 6px}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:16px;margin:0;display:inline}
.summary{color:var(--ts);margin:0 0 14px}
.section.top{background:var(--card);border:1px solid var(--bs);border-radius:14px;padding:16px 14px;margin:14px 0;scroll-margin-top:10px}
.section.sub{margin:16px 0 4px;border-top:1px solid var(--bs);padding-top:12px}
details.section.sub summary{cursor:pointer;list-style:revert}
.sbody>*+*{margin-top:12px}
.sbody{margin-top:10px}
.text{margin:0}
.cap{display:block;font-size:13px;color:var(--ts);margin-bottom:4px}
.toc{background:var(--card);border:1px solid var(--bs);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 14px}
.toc .cap{width:100%}
.toc a{color:var(--tp);font-size:14px}
.field{display:block}
input,select{width:100%;font:inherit;font-size:16px;color:var(--tp);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 10px;min-height:44px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ts) 50%),linear-gradient(135deg,var(--ts) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:4px}
.seg button{flex:1 1 0;min-width:72px;font:inherit;font-size:14px;border:0;border-radius:9px;padding:9px 10px;min-height:40px;background:transparent;color:var(--tp);cursor:pointer}
.seg button.on{background:var(--pri);color:var(--prit);font-weight:600}
.btn{font:inherit;font-size:15px;border:1px solid var(--bd);background:var(--card);color:var(--tp);border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--pri);color:var(--prit);border-color:var(--pri);font-weight:600}
.btn:disabled{opacity:.4}
.callout{border:1px solid var(--bd);border-radius:12px;padding:12px}
.callout.info{background:var(--info);border-color:var(--infob)}
.callout.warning{background:var(--warn);border-color:var(--warnb)}
.tone-danger{color:var(--danger);font-weight:700}
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:13px;color:var(--ts);font-weight:600;border-bottom:1px solid var(--bd);padding:8px 8px}
.tbl td{border-bottom:1px solid var(--bs);padding:10px 8px;vertical-align:top}
@media (max-width:700px){
 .tbl thead{display:none}
 .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
 .tbl tr{border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:10px;background:var(--bg)}
 .tbl td{border:0;padding:4px 0;display:flex;gap:10px}
 .tbl td::before{content:attr(data-label);flex:0 0 96px;font-size:12px;color:var(--ts);padding-top:2px}
 .tbl td:first-child{display:block}
 .tbl td:first-child::before{display:none}
 .tbl td.empty{display:none}
 .tbl td>*:not(.btn){flex:1}
}
.steps{margin:0;padding-left:22px}.steps li{margin:8px 0}.steps li div{color:var(--ts)}
.bullets{margin:0;padding-left:20px}.bullets li{margin:6px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{display:block;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;color:var(--tp);text-decoration:none}
.eq{font-size:17px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.frac .fn{border-bottom:1px solid var(--tp);padding:0 4px}.frac .fd{padding:0 4px}
.sources{margin-top:24px;color:var(--ts);font-size:13px}.sources ul{margin:4px 0;padding-left:18px}
.nojs{padding:16px}

.bk textarea{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--tp);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;resize:vertical}
.bk .row{display:flex;flex-wrap:wrap;gap:8px}
.bk .msg{font-size:14px;margin:0;min-height:1.2em}
.bk .msg.ok{color:var(--acc)}.bk .msg.err{color:var(--danger)}
.bk input[type=file]{display:none}
</style></head><body>
<div id="app"><noscript><p class="nojs">Questa app ha bisogno di JavaScript. Se la stai vedendo in anteprima (per esempio dall'app File o da un allegato), aprila in Safari.</p></noscript></div>

ali e frontali|Bicipiti panca inclinata|Skullcrusher a terra|Leg extension|Pull down|Polpacci da seduto|Reverse crunch|Distensioni su panca inclinata|Rematore a 1 manubrio|Bicipiti a martello|Estensioni tricipiti a 90 con corda|Core power con bilanciere|Stacchi gambe semitese|Alzate laterali e a 90 gradi|Scott al cavo basso|Dips|Front squat|Pull over manubri|Russian twist|Croci inclinate|Pulley|Bicipiti manubri alternati|Push down con corda|Crunch obliquo|Hip thrust|Tirate al cavo alto|Bicipiti con disco|Estensioni tricipiti su panca inclinata|Lat machine stretta|Spiderman|Wipers|Chest press|Distensioni manubri|Renegade row|Scott inversa|Push down|Dynamic side plank|Hyperextension|Aperture incrociate cavi bassi|Curl presa prona|Lying crossface tric ext|Seal row|Crunch machine|Panca stretta|Rematore con manubri|Row machine|Twisting sit up|Arnold press|Fitball wide crunches (lezione senza video)|Pectoral machine|T-bar row|Dragon flag e regression|Estensioni seduto 1 braccio|Leg press|Stacco sumo".split("|"),Wi=[{id:"squat",label:"Back squat"},{id:"pullup",label:"Pull up / Lat machine"},{id:"military",label:"Military press"},{id:"stacco",label:"Stacco da terra"},{id:"panca",label:"Panca piana"},{id:"row",label:"Rematore (Pendlay row)"}],Ve=["A","B","C","D"],Hi="kong-classic-app-v1",he={1:["leggera","inizio del mesociclo: volume basso, tecnica perfetta"],2:["media","meno serie della settimana 1 ma pi\xF9 ripetizioni totali"],3:["pesante","pi\xF9 serie e ripetizioni, non per forza carichi pi\xF9 alti"],4:["medio-pesante","prima settimana dopo la pesante; chiude il mesociclo leggera \u203A media \u203A pesante \u203A medio-pesante"],5:["","inizio mesociclo 2: +15% di volume sui fondamentali, \u221210% su braccia, polpacci e addominali"],6:["pesante","seconda e ultima settimana pesante del bimestre 1"],7:["scarico","pi\xF9 leggera della 6, per arrivare carico ai test della 8"],8:["scarico \xB7 test massimali","fine bimestre 1: nuovi massimali nelle sessioni B, C e D"],9:["pesante","inizio bimestre 2: volume circa il 10% pi\xF9 alto del bimestre 1"],10:["leggera","recupero attivo"],11:["medio-pesante","seconda met\xE0 del 3\xB0 mese; dalla 13 una nuova tecnica di intensit\xE0"],12:["media","fine del 3\xB0 mese, un quarto del programma"],13:["pesante","inizio 4\xB0 mese: volume circa \u221210%, tornano le singole; unica tecnica il rest-pause"],14:["medio-pesante","ultimo blocco pesante prima dei test"],15:["scarico","recupero per i test della settimana 16"],16:["leggera \xB7 test massimali","fine bimestre 2: nuovi massimali nelle sessioni B, C e D"],17:["pesante","inizio bimestre 3: focus sulla forza, 3\xB0 picco di volume dell'anno"],18:["","volume in aumento rispetto alla 17; il video indica la 19 come la pi\xF9 dura del mese e la 20 di recupero"],19:["da verificare","video A: recupero attivo con meno serie; video B\u2013D: blocchi pesanti da 10 serie"]},ya={"1A":["Settimana leggera: volume basso, tecnica perfetta. Logica del mesociclo: leggera \u203A media \u203A pesante \u203A medio-pesante (recupero).","Split set = alternare i due esercizi della coppia. L'app calcola i carichi dai massimali.","Prima mobilit\xE0 e riscaldamento con bilanciere scarico; niente ego-lifting.","Squat con il bilanciere dietro la nuca. Pull up: sbarra fino alla base del collo.","Pendlay row con il busto tra 45\xB0 e 90\xB0. Curl con bilanciere EZ o dritto; push down con corda o barra."],"1B":["Stacco sumo o regular \xE8 una scelta personale, ma resta coerente: non usare il 1RM del regular per calcolare i carichi del sumo (e viceversa).","Military press in piedi con bilanciere libero: niente Smith machine, non da seduto. Gambe tese, glutei e addome contratti. Se manca mobilit\xE0 di spalla lavora sulla mobilit\xE0, altrimenti sostituisci con il press a un braccio con manubrio.","Panca: piedi ben appoggiati a terra; l'arco va bene ed \xE8 sicuro.","Polpacci in piedi o a gambe tese (pressa, macchina in piedi o donkey) per il gastrocnemio, non a ginocchia piegate.","Jackknife 3\xD720: sdraiato, chiuditi come una palla.","Addominali molto legati alla genetica: allena il core con costanza ma senza forzare (Luigi racconta di 4 ernie dovute all'eccesso)."],"1C":["Squat + pull up pesanti, 3 serie \u201C2-1-2\u201D con i carichi dell'app (nel video lo schema delle ripetizioni non \xE8 chiaro). Fai le serie di avvicinamento.","Pull up: scalda spalle e tricipiti (rischio epicondilite). Alternative: elastici loop, rematore con bilanciere, TRX row, inverted row.","Leg curl seduto: rotula libera fuori dal cuscinetto, glutei contratti, non sollevare sedere o busto.","Alzate frontali con presa prona o neutra, braccia tese. Laterali: la mano mai pi\xF9 alta del gomito, all'altezza della spalla o poco sopra, anche un po' in avanti (piano scapolare); niente carichi da ego a gomito piegato a 90\xB0 (meglio 10 kg a braccio teso che 20 kg piegato).","Curl su panca inclinata a 45\u201360\xB0: trova l'angolo senza fastidio al capo lungo; mani supinate per tutto il movimento (o presa a martello).","Skullcrusher a terra: braccia leggermente indietro, bilanciere all'attaccatura dei capelli; se cedi i dischi toccano il pavimento.","Riscaldamento squat: 3\u20134 min di squat a corpo libero o bilanciere scarico per le ginocchia, 3 min di bacino (spaccate, allungamento dello psoas), 2\u20133 min di foam roller in estensione della colonna."],"1D":["La D \xE8 sempre la sessione pi\xF9 impegnativa: idealmente il giorno prima di un riposo.","Panca + row pesanti (in A con buffer, in B medi); stacco + military medi. Per panca e row pesanti 3, 4 o 5\u20136 serie di avvicinamento.","Polpacci da seduto: macchina, oppure panca + rialzo con manubri pesanti sulle ginocchia, oppure rialzo sotto il bilanciere della Smith sulle cosce con un cuscinetto.","Reverse crunch 30: bacino su il pi\xF9 verticale possibile, mani piatte a terra (non tenerti alla panca dietro la testa, useresti i dorsali).","Se hai poco tempo puoi saltare gli ultimi 10\u201315 min di addominali, ma completa i fondamentali. Il core stabilizza le alzate; il lavoro diretto \xE8 una rifinitura.","Le settimane successive non ripetono semplicemente leggera-media-pesante: la periodizzazione varia."],"2A":["Settimana media: meno serie della 1 (es. 20 contro 22) ma pi\xF9 ripetizioni totali.","Squat + pull up (medi) 3 serie 7-8-7; panca + row 5 serie 10-9-7-6-7 a 12RM; braccia pi\xF9 leggere per restare intorno a 1 h.","Sempre mobilit\xE0 e serie di avvicinamento: mai partire a freddo con il carico di lavoro.","Regola del buffer: completa tutte le serie senza cedimento, con 1\u20132 ripetizioni in riserva.","Non cambiare il 1RM nell'app nei primi due mesi: se un carico \xE8 troppo leggero o pesante aggiusta i dischi a mano, mantenendo serie e ripetizioni.","4 sessioni a settimana (o 3, spostando la 4\xAA alla settimana dopo); tre da 6 esercizi e una da 8; ogni sessione mescola tre livelli di intensit\xE0."],"2B":["Stacco + military pesanti 4 serie 2-3-2-2.","Polpacci 4 serie 12-9-10-11 a 15RM: quando il bruciore diventa forte sei a 2\u20133 ripetizioni dal cedimento, fermati l\xEC. Se \xE8 troppo facile (potresti fare 15-14-13) usa pi\xF9 peso, senza toccare il 1RM.","Addominali = mantenimento.","Coppie: stacco + military, squat + pull up, panca + row; ogni coppia ha una sessione pesante e una pi\xF9 leggera a settimana.","Serie di avvicinamento, esempio: 1RM 200 kg, lavoro a 170 kg \u2192 parti da circa il 50% (100 kg) con solo 2\u20133 salti (100, 130, 150, 170). 6\u20137 serie di avvicinamento sprecano energia e tempo."],"2C":["Squat + pull up pesanti: mobilit\xE0 prima e stessa logica delle serie di avvicinamento.","Leg extension come il leg curl (vasto mediale): su esplosivo, gi\xF9 controllato, facoltativo 1 s di contrazione in alto.","Pull down: controlla le spalle, angolo del gomito costante, addome contratto.","Polpacci da seduto come quelli in piedi (aumenta il carico se \xE8 troppo facile); reverse crunch.","Consiglia i suoi corsi Mobilizing e Myofascial Release; per un controllo della tecnica chiedi nel gruppo Kong Legacy.","Da verificare: leg extension, pull down, polpacci da seduto e reverse crunch nel diario sono nella sessione D, non nella C."],"2D":["Volume medio; la sessione pi\xF9 lunga (8 esercizi). Panca + row pesanti con la stessa logica di avvicinamento.","Leg curl: femorali sottovalutati; concentrica esplosiva, eccentrica controllata.","Spalle: niente slanci o cheating, carichi che lavorino davvero i deltoidi. Bicipiti e tricipiti leggeri oggi.","Da verificare: leg curl, spalle e braccia nel diario sono nella sessione C; le note dei video C e D sembrano invertite."],"3A":["Settimana pesante = pi\xF9 ripetizioni e serie, non per forza carichi pi\xF9 alti.","32 serie totali; coppie squat + pull up, panca + row, braccia. Concentrati su squat e pull up ma risparmia energie per panca e row. Braccia pi\xF9 dure della settimana scorsa.","Gestisci riscaldamento, mobilit\xE0 e recuperi per restare intorno a 1 h\u20131 h 10 (non 2\u20132,5 h)."],"3B":["Qualche serie in meno. Stacco + press 4 serie; panca + row 6 serie (fase media, carico pi\xF9 alto); polpacci + addominali 2 serie.","Gran parte dell'energia va nei primi quattro esercizi: \xE8 normale averne meno per polpacci e addominali.","Mantieni lo stesso impegno mentale serie dopo serie; confronta l'intensit\xE0 percepita con il carico sul bilanciere."],"3C":["Back squat + pull up 4 serie (fase pesante), dopo mobilit\xE0 e 2\u20133 serie di avvicinamento.","Leg curl + alzate laterali/frontali 7 serie: concentra l'energia qui.","Braccia 4 serie a 10RM 9-8-7-8: cedere nelle ultime 1\u20132 serie \xE8 normale per la fatica accumulata."],"3D":["La sessione pi\xF9 lunga del mese, 39 serie. Panca + row 4 serie molto pesanti; stacco + press 6 serie a intensit\xE0 media; leg press o leg extension (nel video non \xE8 chiaro) + pull down 7 serie; polpacci + reverse crunch 4 serie di \u201Crichiamo\u201D.","Mai allenarsi con dolore articolare: rivolgiti a un fisioterapista o osteopata.","Frequenza cardiaca: dopo una serie submassimale pesante (doppia o tripla) dovrebbe arrivare a circa il 70\u201375% della massima; se resta sotto circa 130 bpm il massimale \xE8 calcolato troppo basso, oppure hai una frequenza a riposo molto bassa. I picchi sono su panca, row, stacco e press."],"4A":["Prima settimana dopo la pesante: pu\xF2 essere stato duro completare tutte le serie.","Squat = schema motorio fondamentale. Pull up con qualsiasi presa (supina, neutra, larga, stretta), con il carico richiesto (zavorra, oppure elastici loop per sottrarre); ROM completo: braccia tese in basso, sbarra alla base del collo in alto.","La panca si pu\xF2 sostituire con la chest press se lo stimolo resta lo stesso. Row: meglio pesi liberi che macchine o cavi, niente cheating.","Curl: EZ o dritto, ROM completo; in alto non appoggiare il bilanciere sulle spalle, tieni il carico appena fuori dall'asse del gomito.","Push down: eccentrica lenta; la barra risale solo fino al petto (se arriva a bocca o occhi hai perso il controllo).","Se cedi in una serie non cambiare il programma: posa il peso, rest-pause di 5\u20136 secondi e completa le ripetizioni."],"4B":["Fase pesante per stacco + military (forza e risposta anabolica).","Stacco: mantieni lo stance (sumo o regular) con cui hai iniziato; se la lombare si arrotonda per mobilit\xE0 scarsa metti il bilanciere su rialzi.","Military: niente Smith (busto inclinato, niente stabilizzazione); press a un braccio solo con gravi limiti di mobilit\xE0 di spalla.","Polpacci rigorosi: allungamento pieno in basso, pausa, su, pausa; niente mezze ripetizioni, rimbalzi o ginocchia piegate (esempio: 15 ripetizioni nella prima serie, 11 nella seconda con 90 s di recupero).","Jackknife 3\xD720 senza pause; se \xE8 troppo facile accorcia il recupero, poi usa il TUT (3 s per chiudere, 1 s di contrazione, 3 s per aprire).","Obbligatorio: 5\u201312 minuti di mobilit\xE0 articolare + serie di avvicinamento specifiche in ogni sessione; bici o tappetino non contano. Polpacci e addominali sono alla fine cos\xEC puoi autoregolare il volume."],"4C":["24 serie totali. Leg curl seduto o sdraiato: scegli una macchina e tienila per un mese o due.","Alzate laterali e frontali: non oltre la parallela (subentra il trapezio) e non gi\xF9 fino ai fianchi (tensione costante); nelle laterali busto inclinato di circa 30\xB0, braccia semi-tese.","Bicipiti su panca inclinata a 60\xB0 (a 45\xB0 o 30\xB0 il braccio va troppo dietro il busto, rischio per il capo lungo). Skullcrusher a terra: la spalla resta ferma.","24 serie \xD7 2' = 48 min di recupero: prova ad accorciarlo per aumentare la densit\xE0, senza cedere nelle serie. Mantieni le varianti scelte per misurare i progressi."],"5A":["Inizio mesociclo 2: +15% di volume sui fondamentali rispetto al mesociclo precedente, \u221210% su braccia, polpacci e addominali; pi\xF9 ripetizioni pesanti a scapito di quelle leggere."],"5B":["Fase pesante con singole a carico submassimale (1*): la singola deve essere pi\xF9 pesante del carico usato per doppie e triple.","Addominali: 1 serie \xD7 15 con 2\u20133 secondi di contrazione di picco (o TUT lento)."],"5C":["Lezione sulla respirazione. Squat: inspira e trattieni l'aria per tutto il movimento, espira solo in alto.","Pull up: inspira prima e trattieni; espira durante la discesa o alla fine (alcuni espirano in alto e scendono a polmoni vuoti). In ogni fase concentrica l'aria entra o resta bloccata.","Leg curl seduto: inspira prima, espira mentre fletti la gamba, inspira in estensione. Alzate laterali e frontali: espira salendo.","Curl: espira salendo, inspira scendendo; con un carico molto pesante trattieni il fiato in discesa, espira in basso, un paio di respiri, poi la ripetizione successiva.","Niente rimbalzi a elastico: ogni ripetizione pulita e a s\xE9 stante. Anche qui singole submassimali."],"5D":["Chiude la prima settimana del nuovo mesociclo: il volume \xE8 stabilmente pi\xF9 alto. 26 serie, almeno 1 h 15.","Usa gli split set se riesci; puoi accorciare i recuperi se li gestisci. Usa la durata di questa sessione per pianificare il tempo da dedicare agli allenamenti nei prossimi mesi."],"6A":["Seconda e ultima settimana pesante del bimestre 1; le due successive scaricano per arrivare con energia ai nuovi massimali.","30 serie: prima coppia 6 serie per esercizio, seconda 7, braccia 2 (fase leggera per le braccia: non aggiungere serie).","Sessione da almeno 1,5 h: con recupero di 1' sono 30 min di pause, con 1,5' 45 min, con 2' 1 h.","Profondit\xE0 dello squat: piega dell'anca appena sotto il ginocchio; pi\xF9 in basso va bene se la mobilit\xE0 lo consente; senza arrivare alla parallela \xE8 inefficace; non scendere sotto la parallela se perdi la curva lombare (butt wink). Entro la settimana 6 la tecnica dello squat deve essere sotto controllo.","Rest-pause, esempio in panca: se cedi alla 9\xAA ripetizione su 11, appoggia il bilanciere, respira, staccalo e completa le ultime 2.","I carichi della settimana pesante lasciano tecnicamente un buffer, ma cedere nelle ultime serie per la fatica accumulata \xE8 normale. Kong non \xE8 per chi ha poco tempo."],"6B":["Primo \u201Cdoppio singolo\u201D: stacco + press 5 serie: 3 ripetizioni, 1 (submassimale), 4 (carico ridotto), 1 (submassimale), 4 (carico ridotto).","Polpacci 2 serie con TUT 1-2-1-3 (1 s fermo in allungamento in basso, 2 s su, 1 s di contrazione, 3 s gi\xF9).","Addominali: contrazione di picco forte; se non hai sentito bruciare l'esecuzione era sbagliata: filmati e pubblica il video per una correzione.","Stacco: mantieni le curve della schiena; usa straps o ganci perch\xE9 la presa non ceda. Gestisci bene i recuperi dopo le singole pesanti. \xC8 previsto un \u201CKong Lab\u201D sulla presa."],"6C":["Pi\xF9 pesante della B. Squat e pull up in doppio singolo (submassimale); leg curl 8 serie; alzate laterali 8 serie (nel diario: 7 serie); bicipiti 2 e tricipiti 2 serie (fase leggera, in parte con TUT).","Pull up: l'unico obiettivo \xE8 portare la sbarra sotto il mento; la posizione delle gambe \xE8 irrilevante per forza e ipertrofia."],"6D":["La sessione pi\xF9 lunga: 8 esercizi, 39 serie, circa 2 h. Panca + row in doppio singolo (submassimale); stacco + press 6 serie; leg extension 7; pull down 7; polpacci 2 serie leggere; addominali 1 serie di \u201Crichiamo\u201D con contrazione di picco.","Serie di avvicinamento e mobilit\xE0, soprattutto per il military press. Organizzati per non interrompere la sessione."],"7A":["Penultima settimana del bimestre 1: pi\xF9 leggera della 6; la 8 sar\xE0 ancora pi\xF9 leggera, con i nuovi massimali.","Gli esercizi cambiano ogni bimestre (tranne i fondamentali): dai un voto a ciascuno per capire quali ti hanno dato pi\xF9 beneficio.","Carboidrati in fase di massa: se possibile 1/4 dei carboidrati del giorno 30\u201360 min prima dell'allenamento, 1/4 subito dopo o entro 1 h, l'altra met\xE0 distribuita nella giornata."],"7B":["Allenamento della presa: stare appeso alla sbarra, obiettivo 2 min totali al giorno (se reggi solo 20\u201330 s, ripeti durante la giornata).","Tenuta isometrica 4 \xD7 30 s al 50% del 1RM dell'alzata in cui cede la presa (es. stacco 200 kg \u2192 100 kg), a fine sessione di stacco.","Farmer walk 150\u2013200 m (borse della spesa, kettlebell, manubri pesanti) 2\u20134 volte a settimana; fat grip sul bilanciere."],"7C":["Tecnica dello squat: filmati dal pavimento (di lato, 3/4 da dietro, da dietro).","Piede ben piatto e fermo: niente rotazione esterna o supinazione, niente cedimento in pronazione; peso n\xE9 sulle punte n\xE9 sui talloni; serve mobilit\xE0 di caviglia perch\xE9 le ginocchia arrivino sopra le punte.","Lo stance dipende dalle leve (slide di Marco Enrico Zanolini): gambe corte e busto corto o medio \u2192 medio/largo; gambe corte o medie e busto lungo \u2192 stretto/medio; gambe lunghe e busto corto \u2192 stretto/medio/largo; gambe lunghe e busto medio \u2192 medio; gambe lunghe e busto lungo \u2192 stretto/medio.","Fonte di forza: anche \u2192 stance largo (adduttori, glutei, quadricipiti); gambe \u2192 medio/largo (quadricipiti, adduttori); schiena \u2192 medio/stretto (quadricipiti, glutei)."],"8A":["Settimana di scarico con i nuovi massimali.","Tecnica del pull up: posizione hollow, addome contratto, gambe tese e unite leggermente in avanti; niente kipping; spalla attiva in basso (dorsali attivi); mento decisamente sopra la sbarra senza toccare il petto, altrimenti la ripetizione non vale; non aprire troppo i gomiti; niente rimbalzi in basso."],"8B":["Test massimali giorno 1: stacco + military press. Mobilizza prima dello stacco (estensioni della schiena).","Fai solo le prime tre serie di avvicinamento programmate (es. 4 ripetizioni, 3, poi 1 con carico aumentato), poi SOLO singole crescenti fino al massimale; in alternativa 4-3-2 e poi singole.","Aspettati +5% o pi\xF9 rispetto all'inizio (fino al 15% per alcuni); il powerbuilding fa diventare anche pi\xF9 grossi, magari con meno forza pura del powerlifting.","Panca, row, polpacci e addominali tranquilli, senza test."],"8C":["Test massimali giorno 2: squat + pull up. Scalda bene: mobilizza caviglie, anche, estensioni della schiena; per il pull up mobilit\xE0 delle spalle.","1RM valido nel pull up = esecuzione rigorosa, mento chiaramente sopra la sbarra (es. +2 o +5 kg di zavorra).","Prime 3 serie di avvicinamento come da programma, poi singole; sconsiglia di fare tutto il volume programmato \u201C4,3,1,2,2\u201D prima delle singole (ok se hai tempo ed energia).","Complementari (leg curl 4, alzate laterali 4, bicipiti 3, tricipiti 3): eccezione alle regole, puoi recuperare di pi\xF9 e abbassare carico o ripetizioni. Non distruggere il motore."],"9A":["Prima settimana del bimestre 2: partenza pesante, volume circa il 10% pi\xF9 alto del bimestre 1 (il terzo bimestre ancora di pi\xF9).","Circa 36\u201340 serie. Squat + pull up 9 serie 8-7-6-5-8-6-7-7-7; seconda coppia 8 serie; braccia 6 serie totali (poche perch\xE9 sei esausto).","Inserisci i 1RM corretti nell'app: si aggiornano solo una volta per bimestre.","Buffer e cedimento si alternano: un carico che all'inizio lascia buffer probabilmente ti porter\xE0 al cedimento verso la fine.","Se non riesci a finire: togli 1\u20132 serie, fai meno ripetizioni o abbassa leggermente il carico; intensit\xE0 alta ma non traumatica. Il programma non vede il tuo recupero quotidiano: autoregolati."],"9B":["Pesante e dura; 2 serie in meno della settimana prima.","Prima coppia solo doppie + una singola, con ampio buffer: la singola usa lo stesso carico delle doppie, non preoccuparti se sembra facile.","Panca + row 9 serie a 10RM (nel diario: 75% 1RM): prima met\xE0 con buffer, seconda met\xE0 probabilmente a cedimento.","Polpacci da seduto 4 serie 8-9-8-6 a 15RM: lenti, contrazione di picco, allungamento completo.","Core power rollout: bacino in retroversione, lombare neutra, addome verso la colonna, muoviti come un blocco unico; abbassa il bacino verso il pavimento lasciando estendere le braccia, tensione costante, non tornare indietro a riposare, non allungarti oltre ci\xF2 che controlli."],"9C":["Squat + pull up 5 serie pesanti; stacco a gambe semitese + alzate laterali e a 90\xB0 8 serie; braccia 3 serie ciascuno.","Scott al cavo basso se non hai la panca Scott. Dips: scendi fino ai gomiti all'altezza delle spalle, elastici loop se sono troppo duri.","Stacco a gambe semitese: senti solo i femorali; controlla le ultime 3 serie; rest-pause se non riesci a finire.","Laterali 12RM in superserie con le alzate a 90\xB0 (10-8-9-10): niente slanci, non piegare troppo le braccia, pausa di 1\u20133 s tra le ripetizioni ok. Alzate a 90\xB0: sguardo a terra, busto a 90\xB0, braccia larghe \u201Ccome un avvoltoio\u201D; tieni pronte due coppie di manubri.","Filmati nelle serie pi\xF9 dure e stanche."],"9D":["49 serie, volume altissimo: pu\xF2 essere traumatico se non sei abituato. Se \xE8 troppo, personalizza: dividi su due giorni o riduci carico, serie o ripetizioni.","Panca + row 5 serie pesanti; stacco + military 9 serie a 9\u201310RM (nel diario: 75% 1RM) 8-7-6-5-8-6-7-7-7: prima met\xE0 con buffer, seconda a cedimento, abbastanza veloce.","Front squat 8 serie a 12RM 10-8-9-10-8-7-10-8: esercizio \u201Cpilota\u201D per impararlo; nelle serie da 10 circa 2 ripetizioni di buffer.","Pull over con manubrio: sdraiato lungo o di traverso sulla panca, manubrio all'altezza degli occhi portato indietro, allungamento di dorsali e ascella.","Polpacci alla pressa 4 serie; Russian twist 100 ripetizioni (rest-pause ammesso, es. 40 + 20 + \u2026)."],"10A":["Settimana leggera del bimestre 2: recupero attivo.","Squat 2 serie, pull up 2, distensioni con manubri 4, rematore 4, braccia 3 + 3 (18 serie totali). Buffer ampio su tutte le serie, mai a cedimento: l'obiettivo \xE8 il recupero fisico."],"10B":["Tutta la concentrazione sulla prima coppia: stacco e military pesanti 6 serie ciascuno (due serie da 4, poi triple e doppie). Da verificare: nel diario la B ha 2-2-2-1-2 (5 serie); lo schema 4-2-4-3-2-2 \xE8 in C e D.","Panca 2, row 2, polpacci 4, core power con bilanciere 2 serie \xD7 max (batti di 1\u20132 ripetizioni la settimana scorsa). Il resto con buffer comodo."],"10C":["Squat e pull up pesanti 6 serie ciascuno: le due serie da 4 quasi a cedimento, tutte le altre con buffer; se fatichi a completare il volume recupera di pi\xF9.","Stacco a gambe semitese 4 + alzate a 90\xB0 4: senti i femorali, non la zona lombare; DOMS lombari il giorno dopo = esecuzione sbagliata. Filmati e usa Kong Legacy.","Bicipiti 7 + tricipiti 7 serie. Ascolta come ti senti: misura la tua \u201Callenabilit\xE0\u201D (capacit\xE0 di recupero). La sessione successiva \xE8 pi\xF9 leggera sulle braccia."],"10D":["Sessione pi\xF9 lunga: come la B con le intensit\xE0 invertite, 8 serie in pi\xF9. Panca + row pesanti 6 serie (due da 4, triple, doppie); stacco + military medi (serie da 7 e 8).","Front squat 4 serie 8-9-7-6 a 12RM e pull over uguale (12RM). Polpacci 5 serie.","Russian twist 100 ripetizioni totali: batti la settimana scorsa; se hai fatto 3 serie (50-30-20) punta a 2 (60-40); se ne servono ancora 3, carica la prima (60-32-8)."],"11A":["Medio-pesante, seconda met\xE0 del 3\xB0 mese; dalla settimana 13 arriva una nuova tecnica di intensit\xE0.","Squat + pull up medi a 10\u201311RM (nel diario: 75% 1RM), 5 serie 8-7-6-7-6 con ampio buffer.","Seconda coppia 12\u201313RM 7 serie 10-8-9-7-8-6-7 con leggero buffer: 2\u20133 ripetizioni di riserva nelle serie da 10, 1\u20132 in quelle da 9.","Rest-pause (unica tecnica di intensit\xE0 per ora): dentro la serie (es. obiettivo 6, cedi a 4: 10\u201315 s di pausa e finisci le 2), oppure accoda le ripetizioni mancate in una serie extra a fine esercizio (es. 2 + 3 mancate \u2192 una serie extra da 5). Oppure riduci semplicemente il volume: il programma non deve essere traumatico."],"11B":["Stacco + military pesanti a 5\u20136RM, 7 serie 4-3-2-4-3-2-3; dopo il primo blocco puoi recuperare anche 2,5'. La seconda serie da 4 e l'ultima da 3 probabilmente a cedimento.","Se \xE8 troppo dura: recupera di pi\xF9, togli una ripetizione o salta una serie; NON abbassare il carico.","Seconda coppia 10\u201311RM 5 serie 8-7-6-7-6 con ampio buffer.","Polpacci 4 serie molto leggeri con contrazione di picco: 2 s in punta di piedi, 1\u20132 s in basso con i talloni sotto l'avampiede.","Core power con bilanciere 3 serie al massimo (terza volta): aggiungi una 3\xAA serie e pareggia le ripetizioni delle serie di riferimento."],"11C":["Coppia pesante 5\u20136RM 7 serie 4-3-2-4-3-2-3 (pochissimo buffer); coppia leggera 12\u201313RM 7 serie 10-8-9-7-8-6-7 con ampio buffer; braccia 10RM 2 + 2 serie 9-8 di \u201Crichiamo\u201D.","Puoi dividere la sessione in due. Se la coppia pesante ti intimorisce o perdi concentrazione, fai 1\u20132 ripetizioni in meno nelle serie dure o salta l'ultima."],"11D":["Sessione pi\xF9 lunga, in 4 parti (pesante / leggera / pesante / leggera).","Panca + row 5\u20136RM 7 serie 4-3-2-4-3-2-3: 4\xAA e ultima serie a cedimento; rest-pause o salta serie se non hai energia. Parte 2 a 10\u201311RM 5 serie 8-7-6-7-6 rilassate.","Front squat + pull over 12\u201313RM 7 serie 10-8-9-7-8-6-7: \u201Cleggero vuol dire tutto e niente\u201D, bruciore lattico.","Polpacci 4 serie veloci a cedimento con bruciore. Russian twist 120 ripetizioni, anche solo in due serie (progressione dalle 100 delle ultime due settimane)."],"12A":["Settimana media; fine del 3\xB0 mese, un quarto del programma: le due settimane pi\xF9 dure del mese sono passate.","Sessione tranquilla. Prima coppia 5 serie a carichi medi, tutte con buffer (l'ultima un po' pi\xF9 vicina al cedimento). Seconda coppia carico leggero ma un po' pi\xF9 impegnativa. Braccia 15RM 2 serie 14-11 di \u201Crichiamo\u201D.","A questo punto dovresti avere il doppio o il triplo dei risultati; se no, qualcosa non va: condividi i dubbi su Kong Legacy."],"12B":["Stacco + military 5 serie a 4\u20135RM 4-3-2-2-2, tutte con buffer; panca + row 10\u201311RM 5 serie 7-6-7-6-6 con buffer.","Mobilit\xE0 prima del military press: spalle, estensione della schiena, rotazioni interne ed esterne.","Polpacci 4 serie (prime due con buffer, spingi un po' la terza, 8 ripetizioni la quarta): pi\xF9 lenti, TUT, contrazione di picco.","Core power rollout 3 serie al massimo: corpo come un blocco unico, pancia che non cede, retroversione completa del bacino (glutei bloccati, pube in avanti), scendi verso il pavimento senza che l'ombelico spinga il bilanciere in avanti, resta in controllo. Meglio poche ripetizioni perfette che tante sporche; annota le ripetizioni e batti il record."],"12C":["Energia distribuita in modo uguale. Prima coppia 5 serie 4-3-2-2-2: la prima da 4 quasi a cedimento, le altre con buffer.","Seconda coppia 12\u201313RM 5 serie 10-9-8-7-9 con piccolo buffer, molto vicino al cedimento.","Braccia 4 serie 10-7-8-9 tutte a cedimento: prima serie a tutta, quella da 7 sembrer\xE0 pi\xF9 dura del previsto per la fatica, le ultime due quasi a cedimento."],"12D":["Sempre la sessione pi\xF9 dura della settimana (non la pi\xF9 dura del mese passato).","Prima coppia 5 serie (una da 4 all'inizio, poi doppie e una tripla); 10 min di recupero prima della seconda coppia; seconda coppia 10\u201311RM 5 serie 7-6-7-6-6.","Front squat + pull over 12\u201313RM 5 serie 10-9-8-7-9: pump, vicino al cedimento per la fatica accumulata.","Polpacci 4 serie 10RM 8-9-7-7 (nel diario: 7 serie 9-8-7-8-8-7-6).","Russian twist 120 ripetizioni con torsione completa del busto, senza cheating, idealmente in una serie, altrimenti esattamente due."],"13A":["Inizio del 4\xB0 mese, seconda met\xE0 del bimestre 2: circa il 10% di volume in meno del mese precedente; tornano le singole (powerbuilding); unica tecnica di intensit\xE0 del mese: rest-pause.","Squat + pull up 8 serie a 10\u201311RM (nel diario: 75% 1RM) 8-7-6-9-6-7-6-8: le prime 8-7-6 con buffer, la 9 a cedimento, le successive 6 e 7 quasi a cedimento, l'ultima da 8 dipende (buffer, cedimento o tecnica).","Seconda coppia 7 serie 12\u201313RM 10-8-7-8-8-7-6, chiusa con buffer se gestisci i recuperi.","Bicipiti + tricipiti 2 serie ciascuno a 15RM 12-10 di \u201Crichiamo\u201D: non spingere anche se hai energia.","Rest-pause solo su 1 serie di squat o di pull up. Ciclizzazione = momenti in cui \u201Csputi sangue\u201D e momenti di riposo."],"13B":["Pesante. Stacco + military 3 serie 4-1-3 con carichi oltre l'80% del 1RM; la singola \xE8 un test submassimale pi\xF9 pesante della quadrupla.","Panca + row 8 serie 10\u201311RM 8-7-6-9-6-7-6-8 (8-7-6 sicure, la 9 quasi a cedimento).","Core rollout 2 serie max + max (come un rest-pause: massimo delle ripetizioni, breve pausa, altre ripetizioni). Polpacci 3 serie 12-10-9 lenti, ROM completo."],"13C":["Simile alla A ma pi\xF9 lunga. Prima coppia 4-1-3 (singola pi\xF9 pesante della quadrupla); coppia centrale 7 serie tutte con buffer (anche solo di 1 ripetizione), mai a cedimento; braccia 6 serie 10RM 9-8-7-8-7-8 (9-8-7 molto vicine al cedimento).","Primi due terzi con buffer, ultimo terzo (braccia) a cedimento; tecnica di intensit\xE0 a tua discrezione. Kong come una Lamborghini: sei tu a scegliere quanto premere sull'acceleratore."],"13D":["La sessione pi\xF9 dura del mese: 41 serie (il picco del mese scorso era 49).","Coppia pesante 4-1-3; coppia di ipertrofia front squat + pull over 7 serie 12\u201313RM 10-8-7-8-8-7-6 (nel diario: 5 serie 10-9-8-7-9); se possibile niente tecniche di intensit\xE0.","Polpacci alla pressa 4 serie al cedimento massimo. Russian twist 150 ripetizioni (75 per lato) con un carico di circa il 15% del peso corporeo, nel minor numero di serie possibile.","Smentisce il mito che tante serie e ripetizioni portino al sovrallenamento."],"14A":["Settimana medio-pesante: ultimo blocco pesante prima dei test; la prossima \xE8 pi\xF9 leggera, la 16 di test.","Prima coppia 10\u201311RM 8-7-6 / 8-7; seconda coppia 12RM 10-8-10 / 9-7; braccia 15RM 11-10-13.","Zig-zag tra cedimento e buffer: nelle sessioni pesanti (oltre l'80% 1RM) preferisci il buffer. La prima coppia va fatta con buffer: se arrivi a cedimento stai leggendo male il programma. Seconda coppia piccolo buffer; braccia tranquille (spingi un po' l'ultima da 13).","Regola di aggiustamento: se cedi sistematicamente in serie programmate con buffer, abbassa il peso (stesse serie e ripetizioni) oppure togli serie o ripetizioni (stesso peso).","Kong presuppone esperienza e accumula ripetizioni e tonnellaggio; online non pu\xF2 misurare il tuo recupero: gestisci il buffer con onest\xE0."],"14B":["Volume molto alto sulla prima coppia pesante (ultimo allenamento pesante prima dei test): 3-1-4-1-4; tripla a carico 4\u20135RM, singole pi\xF9 pesanti, quadruple pi\xF9 leggere (\u201Cspara quasi tutto\u201D sulle quadruple di scarico). Prima riscaldamento e serie di avvicinamento.","Panca + row 10\u201311RM 8-7-6-8-7 con ampio buffer. Polpacci 4 serie con buffer ma sentiti.","Core power (ruota o rollout con bilanciere) 2 serie max + max: batti di 1\u20132 ripetizioni totali la settimana scorsa."],"14C":["Prima coppia con lo stesso volume della settimana scorsa.","Stacco a gambe semitese + alzate laterali 5 serie a 12RM 10-8-10-9-7: semitese solo per i femorali, bilanciere fino a poco sotto la rotula (a met\xE0 tibia stai usando la schiena). Idealmente con buffer, cedimento nelle ultime 1\u20132 serie accettabile.","Braccia 4 serie 10RM 9-7-8-9 (nel diario: 9-7-8-6), \u201Cspara tutto\u201D, vicino al cedimento."],"14D":["Sessione pi\xF9 lunga; se hai poco tempo puoi dividerla in due allenamenti. Panca + row pesanti con lo stesso volume della coppia pesante della settimana scorsa.","Stacco + military 5 serie 10\u201311RM 8-7-6-8-7 con ampio buffer.","Terza parte 12RM 10-8-10-9-7, le serie da 10 vicino al cedimento (nel diario: front squat 10-8-8-7-9 e pull over 10-9-8-7-9).","Polpacci 5 serie 10RM 9-8-7-9-6 molto vicino al cedimento, con ROM corto/\u201Csporco\u201D o cheating ammessi nella 4\xAA serie (nel diario: 4 serie 9-8-9-10).","Russian twist 150 ripetizioni totali: batti numero di serie e ripetizioni della settimana scorsa. Quando il buffer \xE8 programmato va rispettato; se cedi quando non dovresti chiedi nel gruppo privato."],"15A":["Settimana di scarico: riposati per i test della settimana 16. Giornata di recupero, molto tranquilla; non aggiungere esercizi o volume.","Prima coppia medio-pesante 10\u201311RM 4 serie 7-6-7-6; seconda coppia leggera 12RM 10-8-9-8; braccia 15RM 3 serie 12-9-7 (la prima quasi a cedimento, le altre con buffer). Tutto con buffer comodo."],"15B":["Prima coppia pesante (massima concentrazione) 6 serie 3-1-3-2-3-2: alza il carico per la singola; tieni il buffer, meglio lasciare una ripetizione che cedere.","Seconda coppia 10\u201311RM 4 serie 7-6-7-6 con ampio buffer.","Polpacci 15RM 4 serie 9-8-9-8, veloci con bruciore o pi\xF9 lenti con contrazione di picco, a scelta; soggettivamente vicino al cedimento.","Core power rollout 3 serie max + max: pareggia le ripetizioni delle prime due serie."],"15C":["Stessa partenza pesante (base 5RM, 6 serie 3-1-3-2-3-2). Seconda coppia 12\u201313RM 4 serie 10-8-9-8 con buffer.","Braccia 10RM 4 serie 9-7-8-6 praticamente a cedimento: se non senti nulla aumenta il carico; se non riesci a finire le 4 serie (es. non arrivi a 6) il carico \xE8 calcolato male.","Le differenze di fatica percepita dipendono da concentrazione mentale e capacit\xE0 di recupero."],"15D":["Sessione pi\xF9 lunga. Prima coppia pesante base 5RM 6 serie 3-1-3-2-3-2 (singola submassimale, alza il carico); seconda coppia 10\u201311RM 4 serie 7-6-7-6; terza coppia 12RM 4 serie 10-8-9-8.","Polpacci 10RM 5 serie 9-8-9-7-9 praticamente a cedimento; Russian twist 100 ripetizioni tranquille.","Tieni il buffer su seconda e terza coppia: la settimana 16 testa i nuovi 1RM."],"16A":["Settimana leggera con i test massimali che chiudono il bimestre 2; nessun test nella sessione A.","Leggera, molto rilassata. Prima coppia 2 serie 8-6 a 10/11RM; distensioni con manubri su panca a 45\xB0 + rematore con manubrio 3 serie 10-11-9 a 12RM: le prime due coppie sono solo un ripasso.","Braccia 4 serie 12-10-13-12 a 15RM vicino al cedimento."],"16B":["Test massimali: stacco + military press. Con i tuoi carichi abituali fai una tripla, un'altra tripla, una doppia se te la senti, poi una singola submassimale, poi SOLO singole crescenti fino al cedimento: nuovo massimale = ultimo carico riuscito. Il video dice di ignorare lo schema suggerito (che descrive come tripla, tripla, singola, doppia, doppia).","Niente split set nei test: completa prima tutti i riscaldamenti e i tentativi di stacco, poi il military.","Panca + row 2 serie 8-6 a 10/11RM di ritocco; polpacci 4 serie 10-7-9-13 a 15RM con ampio buffer; addominali 3 serie max + max."],"16C":["Test massimali: squat + pull up (o lat machine). Ignora l'ordine delle serie dell'app: hai 5 serie di avvicinamento prima delle singole massimali (tripla, tripla, doppia, doppia, singola); in base alle sensazioni puoi farne meno (es. 3-3-2-1 o 3-2-2-1). Recuperi a piacere.","Stacco a gambe semitese + alzate laterali a 90\xB0 3 serie 10-11-9, ripasso rilassato.","Braccia 5 serie 9-7-8-7-8 a 10RM molto vicino al cedimento, cedimento assoluto nelle ultime 1\u20132: va bene fare due test massimali e poi allenare duro le braccia."],"16D":["Test massimali: panca + row. Riscaldamento con tripla, doppia, doppia, singola, poi singole.","Stacco + military 2 serie 8-6 di ripasso; front squat + pull over con manubrio 3 serie 10-11-9 a 12RM; polpacci 4 serie 9-8-9-6 a 10RM circa a cedimento; Russian twist 1 serie da 100.","Anticipazione: il bimestre 3 porta nuove avventure."],"17A":["Inizio bimestre 3: focus sulla forza, pi\xF9 ripetizioni pesanti; 3\xB0 picco di volume dell'anno; si parte pesanti e si scala nel mese; meno volume per braccia, addominali, polpacci e glutei.","Squat + pull up 7 serie al 75% (o 9\u201310RM) 7-6-8-6-7-5-7, tutte con buffer (nel diario: 8 serie 9-7-8-9-7-8-7-5).","Croci 30\xB0 + pulley 7 serie a 12RM (nel diario: 10RM) 10-7-9-8-10-7-8, la 5\xAA quasi a cedimento. Curl manubri alternati + push down corda 5 serie 15RM 14-11-10-12-10 vicino al cedimento.","Croci: angolo 30\u201345\xB0 (pi\xF9 alto = pi\xF9 deltoide anteriore), scegline uno e tienilo per misurare i progressi; braccia quasi tese (leva pi\xF9 lunga = meno peso, stesso stimolo sul petto, pi\xF9 pulito).","Pulley: puoi inclinare il busto in avanti, evita gli slanci; la chiave \xE8 a fine tirata: adduci completamente le scapole, apri il petto e contrai.","Curl: alternati o insieme; parti gi\xE0 supinato, non ruotare alla fine; se dondoli appoggia schiena e bacino a un muro. Push down con corda: mani unite in alto, allargale in basso."],"17B":["Stacco + military 4 serie pesanti a 4\u20135RM: 3, 4 (quasi a cedimento), 2, 2.","Panca + row a 9\u201310RM 7-6-8-6-7-5-7 con buffer (nel diario: 75% 1RM, 8 serie 9-7-8-9-7-8-7-5).","Polpacci da seduto 15RM 13-9-8 con ampio buffer.","Crunch obliquo 2\xD715 per lato: torsione completa, il gomito tocca il ginocchio opposto, l'altro braccio appoggiato teso a terra; tutte le ripetizioni da un lato, poi dall'altro, poi recupero."],"17C":["Squat + pull up 4 serie 3-4-2-2 con buffer (la 4 quasi a cedimento).","Hip thrust + tirate al cavo alto 12RM 7 serie 10-7-9-8-10-7-6 (nel diario: 10RM, ultima serie 8).","Curl con disco (un solo disco, pump breve e lento; sostituibile con curl con bilanciere) + estensioni tricipiti su panca inclinata (french press, gomiti paralleli) 15RM 5 serie 14-11-10-12-10 (nel diario: 10RM, 4 serie 10-9-10-9). Polpacci 10RM 4 serie 8-6-7-8.","Hip thrust: panca fissata al pavimento, cuscinetto sul bilanciere, piega profonda dell'anca, estendi completamente le anche, 1 s di contrazione di picco. Carichi pesanti (atlete bikini 100\u2013120 kg; uomini almeno il 30% in pi\xF9 di quello che pensano sia pesante); continua a progredire nelle 8 settimane del bimestre.","Tirate al cavo alto: gomiti sempre pi\xF9 alti delle spalle; rotazione esterna finale facoltativa."],"17D":["La sessione pi\xF9 punitiva della settimana (8 esercizi).","Panca + row pesanti 4 serie 3-4-2-2 con buffer; stacco + press a 8\u20139RM 7-6-8-6-7-5-7 (nel diario: 75% 1RM, 9-7-8-9-7-8-7-5).","Leg extension + lat machine presa stretta 12RM 7 serie 10-7-9-8-10-7-6 (nel diario: 10RM, ultima serie 8). Leg extension: retro delle ginocchia ben appoggiato al cuscinetto. Lat machine: presa neutra o inversa, appena pi\xF9 stretta delle spalle.","Polpacci 10RM 4 serie 8-6-7-8.","Wipers 2\xD720 per lato: piedi uniti, gambe tese in verticale se la mobilit\xE0 lo consente, scendi di 90\xB0 per lato, inversione esplosiva; ginocchia piegate se la mobilit\xE0 \xE8 limitata; se non arrivi a 20 di fila, pausa e completa."],"18A":["Volume in aumento rispetto alla 17 e sotto la 19 (la pi\xF9 dura del mese); la 20 \xE8 di recupero. Coppie con lo stesso schema di ripetizioni ma intensit\xE0 diverse.","Coppia 1 medio-pesante 6 serie 7-6-7-8-6-7 a 9\u201310RM, tutte con buffer (la 4\xAA da 8 pu\xF2 sembrare vicina al cedimento, \xE8 normale). Nel diario: 75% 1RM, 5 serie 8-9-7-9-8.","Coppia 2 leggera 6 serie 8-9-8-9-7-6 a 12RM (nel diario: 10RM) con ampio buffer.","Braccia: bicipiti 2 + tricipiti 2 serie, 15 poi 10 a 15RM; nella prima da 15 dai tutto, la seconda da 10 facile con buffer."],"18B":["Coppia pesante 4-3-4-3-2: vicino al cedimento solo sulla prima e sulla seconda serie da 4 (esattamente due momenti), il resto con buffer.","Coppia centrale medio-pesante 6 serie 7-6-7-8-6-7 a 8\u201310RM con buffer (nel diario: 75% 1RM, 5 serie 8-9-7-9-8).","Polpacci da seduto 3 serie 13-10-12 a 15RM facili. Crunch obliquo 2\xD715 per lato: se la settimana scorsa non riuscivi senza pause, provaci ora."],"18C":["Squat + pull up pesanti 5 serie 4-3-4-3-2 a 4\u20135RM: vicino al cedimento, o con almeno 1 ripetizione in riserva, almeno una volta.","Hip thrust + tirate al cavo alto 6 serie 8-9-8-9-7-6 a 12RM (nel diario: 10RM) con buffer; volume salito a 6 serie.","Braccia 3 serie 8-9-8 a 10RM vicino al cedimento ma non a cedimento; ripetizioni rigorose e pulite, senza slancio."],"18D":["8 esercizi, sessione lunga. Coppia pesante 5 serie 4-3-4-3-2, sempre molto vicino al cedimento.","Coppia medio-pesante 6 serie 7-6-7-8-6-7: la 4\xAA da 8 molto vicina al cedimento, buffer sulle altre; respira nelle serie 6\u20137 (nel diario: 75% 1RM, 5 serie 8-9-7-9-8).","Coppia leggera 6 serie 8-9-8-9-7-6 a 12RM (nel diario: 10RM) interamente con buffer, per la fatica della prima met\xE0.","Polpacci alla pressa 5 serie 9-7-9-8-5 a 10RM molto vicino al cedimento (non pieno). Wipers 2\xD720 PER LATO: per gli addominali meglio di pi\xF9 che di meno.","Regola del bimestre 3: le serie di forza restano con buffer. Una serie da 4 con un certo carico deve sembrare chiaramente pi\xF9 dura all'inizio del bimestre che alla fine: inizia a notarlo ora per accorgerti dei guadagni di forza."],"19A":["Il video A la descrive come sessione omogenea, corta, di recupero attivo, con meno serie e ampio buffer dopo il volume pesante (in contrasto con il video della 18: vedi \u201CDubbi / da verificare\u201D).","Coppia medio-pesante 4 serie 6-7-6-6 a 8\u20139RM (nel diario: 75% 1RM, 3 serie 10-7-9). Coppia centrale 5 serie 8-9-7-6-6 a 12RM (nel diario: 10RM). Braccia 4 serie 14-11-12-9 a 15RM.","Croci a 30/45\xB0: movimento ampio e profondo, non chiudere i gomiti, dorso delle mani verso il pavimento; in alto i manubri non si toccano: fermati quasi in verticale, un po' distanti (in verticale il carico va sulle articolazioni e perdi tensione).","Pulley: tieni la contrazione di picco. Curl alternati: concentrica lenta.","Usa l'energia mentale per esecuzione perfetta, profondit\xE0 e connessione mente-muscolo."],"19B":["Stacco + press pesanti 10 serie a 4\u20135RM: 4, 3, 2, 3, 2, 3, 2, 3, 2, 3. Spingi al massimo la prima serie; le ultime 2\u20133 saranno vicine al cedimento.","Recupero: 2' non bastano. Dopo la serie 5\u20136 passa a 2,5\u20133'; le serie 8\u201310 possono richiedere 5\u20136'.","Coppia medio-pesante a 8\u20139RM 7-6-6: il video dice 4 serie, non \xE8 chiaro se siano 3 o 4 (nel diario: 75% 1RM, 3 serie 10-7-9).","Polpacci 2 serie 10-12 a 15RM, tranquilli come un riscaldamento. Crunch obliquo 2\xD715 per lato."],"19C":["Seconda coppia pesante (squat + pull up) 10 serie con lo stesso schema e gli stessi recuperi della B.","Hip thrust + tirate al cavo alto 5 serie 8-9-7-6-6 a 12RM (nel diario: 10RM): massima profondit\xE0, nessuna pausa in basso (rimbalzo continuo), tieni la contrazione 1\u20132 s in alto; gli uomini spesso hanno poco volume di glutei.","Braccia 4 serie 8-7-8-7 a 10RM, non a cedimento, esecuzione perfetta."],"19D":["Panca + row 10 serie con le stesse regole di B e C (recuperi fino a 5\u20136' nelle ultime serie).","Stacco + press 4 serie 6-7-6-6 ampiamente con buffer per risparmiare energie (nel diario: 75% 1RM, 3 serie 10-7-9).","Leg extension + lat machine presa stretta 5 se 1,5 e 3 minuti secondo necessit\xE0 personale; nelle schede \xE8 indicato 2' per ogni coppia di esercizi."}]})),o(k,{heading:"Regole generali dai video",id:"regole-video"},o(Z,{items:["Riscaldamento obbligatorio in ogni sessione: 5\u201312 minuti di mobilit\xE0 articolare + 2\u20133 serie di avvicinamento specifiche; bici o tappetino non contano (settimane 2 e 4).","Serie di avvicinamento: parti da circa il 50% del carico di lavoro e fai solo 2\u20133 salti (es. 1RM 200 kg, lavoro a 170: 100, 130, 150, 170); 6\u20137 serie di avvicinamento sprecano energia. Per panca e row pesanti anche 3, 4 o 5\u20136 (settimane 1 e 2).","Non cambiare il 1RM nell'app per i primi due mesi: se un carico \xE8 troppo leggero o pesante aggiusta i dischi a mano, mantenendo serie e ripetizioni. Poi i 1RM si aggiornano solo una volta per bimestre, dopo i test (settimane 2 e 9).","Buffer = ripetizioni in riserva (1\u20132): la serie si chiude senza cedimento. Quando il buffer \xE8 programmato va rispettato; nelle sessioni pesanti (oltre l'80% 1RM) preferisci il buffer (settimane 2 e 14).","Regola di aggiustamento: se cedi sistematicamente in serie programmate con buffer, abbassa il peso (stesse serie e ripetizioni) oppure togli serie o ripetizioni (stesso peso). Nei blocchi pesanti della settimana 11: recupera di pi\xF9, togli una ripetizione o salta una serie, ma non abbassare il carico.","Rest-pause, unica tecnica di intensit\xE0 nei primi bimestri: se cedi, posa il peso, 5\u20136 s (settimana 4) o 10\u201315 s (settimana 11) di pausa e completa le ripetizioni; oppure accoda le ripetizioni mancate in una serie extra a fine esercizio.","Singole e doppie: l'1* \xE8 una singola submassimale, pi\xF9 pesante del carico di doppie e triple; nei \u201Cdoppi singoli\u201D le quadruple sono a carico ridotto (settimane 5, 6, 13 e 14). Nella settimana 9 (2-2-2-1-2, senza asterisco) la singola usa lo stesso carico delle doppie.","Recuperi: 2' nel diario; nei video anche 2,5' dopo il primo blocco pesante, 2,5\u20133' e fino a 5\u20136' nelle ultime serie dei blocchi da 10 serie; nei test recuperi a piacere.","Respirazione (settimana 5): nello squat inspira e trattieni per tutto il movimento, espira in alto; in ogni fase concentrica l'aria entra o resta bloccata; nelle alzate e nei curl espira salendo.","Presa (settimana 7): 2 min al giorno appeso alla sbarra, isometria 4 \xD7 30 s al 50% del 1RM dell'alzata in cui cede la presa a fine sessione di stacco, farmer walk 150\u2013200 m 2\u20134 volte a settimana, fat grip; straps o ganci nello stacco pesante.","Mai allenarsi con dolore articolare: rivolgiti a un fisioterapista o osteopata (settimana 3)."]}),o(k,{heading:"Protocollo dei test massimali (settimane 8 e 16)"},o(Re,{steps:[{title:"Mobilit\xE0",detail:"Caviglie, anche ed estensioni della schiena; per pull up e military anche le spalle."},{title:"Poche serie di avvicinamento",detail:"Tripla, tripla o doppia, singola submassimale (es. 3-3-2-1 o 3-2-2-1; nella settimana 8 anche 4-3-1 o 4-3-2). Non serve fare tutto il volume programmato prima delle singole."},{title:"Solo singole",detail:"Singole a carico crescente fino al cedimento: il nuovo massimale \xE8 l'ultimo carico riuscito."},{title:"Niente split set",detail:"Completa prima tutti i tentativi del primo esercizio (es. stacco), poi passa al secondo (es. military)."},{title:"Pull up valido",detail:"Esecuzione rigorosa, mento chiaramente sopra la sbarra; il massimale \xE8 la zavorra aggiunta (es. +2 o +5 kg)."},{title:"Complementari",detail:"Nei giorni di test puoi recuperare di pi\xF9 e abbassare carico o ripetizioni. Poi aggiorna \u201CI tuoi massimali\u201D."}]}))),o(k,{heading:"Dubbi / da verificare",id:"dubbi"},o(Z,{items:["I video coprono solo le settimane 1\u201319; i diari arrivano a 48. Dalla settimana 20 l'app mostra solo il diario, senza etichette di intensit\xE0.","Diario e video non sempre coincidono; l'app calcola sempre con i numeri del diario. Casi trovati: settimana 2, contenuti dei video C  17\u201324) non \xE8 spiegato nel diario.","Leg extension \xE8 indicata come vid.010 nelle settimane 1\u20138, 17\u201332 (in libreria \xE8 il video 16; il 10 \xE8 Polpacci alla pressa). Dalla 33 il diario usa vid.016.","Dragon flag nella settimana 41 \xE8 indicato come vid.059 (Twisting sit up); dalla 42 come vid.064. TTB \xE8 vid.068, che non esiste nella libreria da 67 video.","Settimana 8, sessione D: i polpacci da seduto sono scritti \u201C9-8-9-\u201D (ultima serie vuota). Settimana 14 D: front squat 10-8-8-7-9 e pull over 10-9-8-7-9.","Settimana 46, coppie a 12RM di A, C e D: il primo esercizio parte da 12 ripetizioni e il secondo da 11 (resto identico), come stampato.","La colonna \u201C<20\u201D della tabella (40%) va letta come oltre 20 ripetizioni. Il foglio Excel del corso usa percentuali diverse dal diario (es. 12RM = 70% invece di 65%): scegli il metodo in alto."]})))}fi(o(xa,null),document.getElementById("app"))});Ca();})();

<div class="page" style="padding-top:0"><section class="section top bk" id="backup" aria-labelledby="bk-h">
<h2 id="bk-h">Backup dati</h2>
<div class="sbody">
<p class="text">Massimali, sessioni fatte e impostazioni restano salvati solo su questo dispositivo e in questo browser o app. Se cambi telefono, cancelli i dati di Safari o passi da Safari all'app sulla schermata Home, esporta prima un backup e poi importalo.</p>
<div class="row">
<button type="button" class="btn primary" id="bk-export">Esporta (scarica file)</button>
<button type="button" class="btn" id="bk-copy">Copia negli appunti</button>
<button type="button" class="btn" id="bk-file-btn">Importa da file</button>
<input type="file" id="bk-file" accept="application/json,.json,text/plain">
</div>
<label class="field"><span class="cap">Oppure incolla qui il testo del backup</span>
<textarea id="bk-text" spellcheck="false" autocomplete="off" placeholder='{"app":"kong-classic-2.0", ...}'></textarea></label>
<div class="row"><button type="button" class="btn" id="bk-import">Importa testo incollato</button></div>
<p class="msg" id="bk-msg" role="status" aria-live="polite"></p>
</div></section></div>
<script>
(function(){
  var KEY='kong-classic-app-v1';
  function $(id){return document.getElementById(id);}
  function msg(t,ok){var m=$('bk-msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
  function store(){try{return window.localStorage;}catch(e){return null;}}
  function payload(){
    var ls=store(); if(!ls) throw new Error('Salvataggio non disponibile in questo browser.');
    var raw=ls.getItem(KEY); if(!raw) throw new Error('Non ci sono ancora dati da esportare: inserisci prima i massimali.');
    return JSON.stringify({app:'kong-classic-2.0',key:KEY,exportedAt:new Date().toISOString(),data:JSON.parse(raw)},null,2);
  }
  function stamp(){var d=new Date();function p(n){return String(n).padStart(2,'0');}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
  $('bk-export').addEventListener('click',function(){
    try{
      var txt=payload(); $('bk-text').value=txt;
      var blob=new Blob([txt],{type:'application/json'}); var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download='kong-backup-'+stamp()+'.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url);},4000);
      msg('Backup creato. Se il download non parte, copia il testo qui sotto e salvalo (per esempio in Note).',true);
    }catch(e){msg(e.message,false);}
  });
  $('bk-copy').addEventListener('click',function(){
    var txt; try{txt=payload();}catch(e){msg(e.message,false);return;}
    $('bk-text').value=txt;
    function fallback(){var t=$('bk-text');t.focus();t.select();try{document.execCommand('copy');msg('Testo del backup copiato.',true);}catch(e){msg('Copia non riuscita: seleziona il testo qui sotto e copialo a mano.',false);}}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){msg('Testo del backup copiato negli appunti. Incollalo in Note o mandalo a te stesso.',true);},fallback);}else fallback();
  });
  function doImport(txt){
    var obj; try{obj=JSON.parse(txt);}catch(e){msg('Il testo non è un backup valido (JSON non leggibile).',false);return;}
    var data=(obj&&obj.app==='kong-classic-2.0'&&obj.data)?obj.data:obj;
    if(!data||typeof data!=='object'||Array.isArray(data)||!('lifts' in data||'done' in data||'week' in data)){msg('Il testo non sembra un backup di Kong Classic 2.0.',false);return;}
    if(!confirm('Importare il backup? I dati attuali su questo dispositivo verranno sostituiti.'))return;
    var ls=store(); if(!ls){msg('Salvataggio non disponibile in questo browser.',false);return;}
    try{ls.setItem(KEY,JSON.stringify(data));}catch(e){msg('Non riesco a salvare i dati: '+e.message,false);return;}
    msg('Backup importato. Ricarico l\'app…',true); setTimeout(function(){location.reload();},600);
  }
  function addToc(){var t=document.querySelector('#app .toc'); if(t&&!t.querySelector('a[href="#backup"]')){var a=document.createElement('a');a.href='#backup';a.textContent='Backup dati';t.appendChild(a);}}
  addToc(); setTimeout(addToc,300);
  $('bk-import').addEventListener('click',function(){var t=$('bk-text').value.trim(); if(!t){msg('Incolla prima il testo del backup.',false);return;} doImport(t);});
  $('bk-file-btn').addEventListener('click',function(){$('bk-file').click();});
  $('bk-file').addEventListener('change',function(ev){var f=ev.target.files&&ev.target.files[0]; if(!f)return; var r=new FileReader(); r.onload=function(){doImport(String(r.result));}; r.onerror=function(){msg('Non riesco a leggere il file.',false);}; r.readAsText(f); ev.target.value='';});
})();
</script>
<script>
(function(){
  try{
    if(!('serviceWorker' in navigator))return;
    var secure=window.isSecureContext||location.hostname==='localhost'||location.hostname==='127.0.0.1';
    if(!secure||location.protocol==='file:')return;
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(e){if(window.console)console.warn('Service worker non registrato:',e&&e.message);});
      if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
    });
  }catch(e){}
})();
</script>
